[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-account-switcher"
version = "1.0.0"
description = "A secure CLI tool to manage and switch between multiple Gemini accounts easily."
readme = "README.md"
authors = [
  { name = "minermartijn", email = "minermartijn@gmail.com" },
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer[all]",
    "rich",
    "pyjwt",
]
requires-python = ">=3.8"

[project.scripts]
gemini-switch = "gemini_account_switcher.main:app"

[project.urls]
"Homepage" = "https://github.com/minermartijn/Gemini-Account-Switcher"
"Bug Tracker" = "https://github.com/minermartijn/Gemini-Account-Switcher/issues"
